<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem("emotion-theme");
            const systemPrefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            const theme = savedTheme || (systemPrefersLight ? "light" : "dark");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preload" href="{{ url_for('static', filename='fonts/Inter-Variable.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='fonts/PlusJakartaSans-Variable.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=asset_version) }}">
</head>
<body class="{% block body_class %}page-shell{% endblock %}">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient ambient-three" aria-hidden="true"></div>

    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span data-theme-label>Theme</span>
    </button>

    <div class="flash-stack" aria-live="polite">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">
                        <span>{{ message }}</span>
                        <button class="flash-close" type="button" aria-label="Dismiss" data-flash-close>&times;</button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="loading-toast" id="loadingToast" aria-live="polite" aria-hidden="true">
        <div class="loading-toast-card">
            <span class="loading-spinner" aria-hidden="true"></span>
            <div>
                <strong>Please wait</strong>
                <p>Analysis is running. The result will appear when it is ready.</p>
            </div>
        </div>
    </div>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js', v=asset_version) }}"></script>
</body>
</html>
