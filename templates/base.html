<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem("emotion-theme");
            const systemPrefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            const theme = savedTheme || (systemPrefersLight ? "light" : "dark");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}page-shell{% endblock %}">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>

    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <span data-theme-icon>D</span>
        <span data-theme-label>Theme</span>
    </button>

    <div class="flash-stack">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="loading-toast" id="loadingToast" aria-live="polite" aria-hidden="true">
        <div class="loading-toast-card">
            <span class="loading-spinner" aria-hidden="true"></span>
            <div>
                <strong>Please wait</strong>
                <p>Analysis is running. The result will appear when it is ready.</p>
            </div>
        </div>
    </div>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
